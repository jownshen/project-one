name: Weather check

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may start a few minutes late)
  workflow_dispatch:
    inputs:
      force_level:
        description: "Send a TEST alert at this level (leave blank for a normal run)"
        required: false
        default: ""
      test_channel:
        description: "Only test this channel: email, sms or push (blank = all)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weather-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore last run's state and history from the live site
        run: |
          mkdir -p docs/data
          for f in state.json history.json; do
            curl -sf "${DASHBOARD_URL}data/$f?t=$(date +%s)" -o "docs/data/$f" || echo "no previous $f"
          done

      - name: Check forecast, warnings and tides
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          SEMAPHORE_API_KEY: ${{ secrets.SEMAPHORE_API_KEY }}
          SEMAPHORE_SENDER: ${{ secrets.SEMAPHORE_SENDER }}
          ALERT_PHONES: ${{ secrets.ALERT_PHONES }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_LEVEL: ${{ inputs.force_level }}
          TEST_CHANNEL: ${{ inputs.test_channel }}
        run: python src/run.py ${FORCE_LEVEL:+--force-level "$FORCE_LEVEL"} ${TEST_CHANNEL:+--test-channel "$TEST_CHANNEL"}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
